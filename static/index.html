<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hyatus-ops</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; background: #0b0d10; color: #d5dbe1; padding: 24px; max-width: 1200px; margin: auto; }
  h1 { font-size: 18px; font-weight: 600; }
  h1 span { color: #5b8def; }
  form { display: flex; gap: 8px; margin: 16px 0 24px; }
  input { flex: 1; background: #14181d; border: 1px solid #262d36; border-radius: 8px; padding: 10px 12px; color: inherit; font: inherit; }
  button { background: #5b8def; border: 0; border-radius: 8px; padding: 10px 16px; color: #fff; font: inherit; cursor: pointer; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7d8791; margin-bottom: 8px; }
  .card { background: #14181d; border: 1px solid #262d36; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .card .msg { font-size: 13px; }
  .card .meta { font-size: 11px; color: #7d8791; margin-top: 4px; }
  .esc { border-color: #d97b3f; }
  .esc button { background: none; border: 1px solid #d97b3f; color: #d97b3f; padding: 3px 10px; font-size: 12px; margin-top: 6px; margin-right: 6px; }
  .feed { margin-top: 24px; }
  .feed div { font-size: 12px; color: #8b95a1; padding: 3px 0; border-bottom: 1px solid #161b21; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k { color: #5b8def; }
</style>
</head>
<body>
<h1>hyatus<span>-ops</span> — autonomous apartment operations</h1>
<form id="f">
  <input id="m" placeholder='Simulate an event, e.g. "Water is leaking under the kitchen sink!"' autofocus>
  <button>Send</button>
</form>
<div class="cols" id="cols"></div>
<div class="feed"><h2 style="font-size:12px;color:#7d8791;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">agent activity</h2><div id="feed"></div></div>
<script>
const STATES = ["NEW","TRIAGED","DISPATCHED","ESCALATED","RESOLVED"];
const $ = s => document.querySelector(s);

async function refresh() {
  const {incidents, events} = await (await fetch("/api/state")).json();
  $("#cols").innerHTML = STATES.map(s => {
    const cards = incidents.filter(i => i.state === s).map(i => `
      <div class="card ${s === "ESCALATED" ? "esc" : ""}">
        <div class="msg">${esc(i.message)}</div>
        <div class="meta">#${i.id}${i.category ? " · " + i.category + " / " + i.severity : ""}${i.vendor_id ? " · " + i.vendor_id : ""} · attempts ${i.attempts}</div>
        ${s === "ESCALATED" ? `
          <button onclick="act('${i.id}','close')">resolve manually</button>
          <button onclick="act('${i.id}','redispatch')">send back to agents</button>` : ""}
      </div>`).join("");
    return `<div class="col"><h2>${s} (${incidents.filter(i => i.state === s).length})</h2>${cards}</div>`;
  }).join("");
  $("#feed").innerHTML = events.map(e =>
    `<div><span class="k">${e.kind}</span> #${e.incident_id} — ${esc(e.detail).slice(0, 140)}</div>`).join("");
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function act(id, action) {
  await fetch(`/api/incidents/${id}/human`, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action, note: "via dashboard"})});
  refresh();
}

$("#f").onsubmit = async e => {
  e.preventDefault();
  if (!$("#m").value.trim()) return;
  await fetch("/api/events", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: $("#m").value})});
  $("#m").value = "";
  refresh();
};

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
